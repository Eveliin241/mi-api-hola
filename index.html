<main>
    <div id="user-section" class="view-section active">
        <div class="glass-card">
            <h2><i class="fas fa-user-shield"></i> Investigador Autorizado</h2>
            <input type="text" id="reg_nombre" placeholder="Nombre completo del alumno/equipo...">
            <button class="btn-action" onclick="registrarUser()">DAR DE ALTA EN SISTEMA</button>
        </div>
    </div>

    <div id="reg-section" class="view-section">
        <div class="glass-card">
            <h2><i class="fas fa-microscope"></i> Bitácora de Campo - Semana #8</h2>
            <p style="font-size: 0.8rem; margin-bottom: 20px; opacity: 0.7;">Proyecto PAEC: Jardín Polinizador</p>
            
            <label>Seleccionar Investigador:</label>
            <select id="sel_usuario"></select>

            <h3>1. Crecimiento (Lavanda)</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <input type="number" id="obs_altura" placeholder="Altura Actual (cm)">
                <input type="number" id="obs_hojas" placeholder="Nº de Hojas">
            </div>

            <h3>2. Nutrición y Suelo (Abono)</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <select id="obs_abono">
                    <option value="">Tipo de Abono...</option>
                    <option>Orgánico (Composta)</option>
                    <option>Líquido</option>
                    <option>Mineral</option>
                    <option>Ninguno</option>
                </select>
                <input type="text" id="obs_cantidad_abono" placeholder="Cantidad (ej: 200g)">
            </div>

            <h3>3. Evaluación de Riego (Post-Vacacional)</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <select id="obs_suelo">
                    <option value="">Estado del Suelo...</option>
                    <option>Seco</option>
                    <option>Húmedo</option>
                    <option>Encharcado</option>
                </select>
                <select id="obs_riego_ok">
                    <option value="">¿Riego Adecuado?</option>
                    <option>SÍ</option>
                    <option>NO (Requiere ajuste)</option>
                </select>
            </div>

            <select id="obs_estado" style="margin-top:15px;">
                <option value="">Clasificación de Salud...</option>
                <option>Sana</option>
                <option>Dañada</option>
                <option>Seca</option>
                <option>Floración</option>
            </select>

            <textarea id="obs_notas" rows="4" placeholder="Análisis crítico: Cambios visibles, problemas detectados y causas posibles..."></textarea>
            
            <button class="btn-action" style="background: var(--accent-mate); margin-top:20px;" onclick="guardarObs()">
                <i class="fas fa-save"></i> GUARDAR REPORTE CIENTÍFICO
            </button>
        </div>
    </div>

    <div id="obs-section" class="view-section">
        <h2><i class="fas fa-database"></i> Historial de Bitácora</h2>
        <div id="pills-usuarios" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 25px;"></div>
        <div id="grid-dinamico"></div>
    </div>
</main>

<script>
    const API = 'https://mi-api-hola.onrender.com';
    let dataCache = { usuarios: [], observaciones: [] };
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500, background: '#0d1a16', color: '#c0c0b5' });

    function iniciarApp() {
        document.getElementById('portada').style.transform = 'translateY(-100%)';
        actualizarDatos();
    }

    async function actualizarDatos() {
        try {
            const [uRes, hRes] = await Promise.all([
                fetch(`${API}/lista-usuarios`), 
                fetch(`${API}/lavandas_json`)
            ]);
            dataCache.usuarios = await uRes.json();
            dataCache.observaciones = await hRes.json();
            
            document.getElementById('sel_usuario').innerHTML = dataCache.usuarios.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
            
            const pillsContainer = document.getElementById('pills-usuarios');
            pillsContainer.innerHTML = `<div class="user-pill" style="padding:10px 20px; background:rgba(255,255,255,0.05); border-radius:50px; cursor:pointer;" onclick="renderObservaciones(dataCache.observaciones)">VER TODOS</div>`;
            dataCache.usuarios.forEach(u => {
                pillsContainer.innerHTML += `<div style="padding:10px 20px; background:rgba(255,255,255,0.05); border-radius:50px; cursor:pointer;" onclick="filtrarPorUser(${u.id})">${u.nombre}</div>`;
            });
        } catch (e) { console.error("Error cargando datos:", e); }
    }

    async function guardarObs() {
        // VALIDACIÓN ESTRICTA: No permitir campos vacíos
        const campos = {
            usuario_id: document.getElementById('sel_usuario').value,
            altura: document.getElementById('obs_altura').value,
            hojas: document.getElementById('obs_hojas').value,
            abono: document.getElementById('obs_abono').value,
            suelo: document.getElementById('obs_suelo').value,
            riego: document.getElementById('obs_riego_ok').value,
            estado: document.getElementById('obs_estado').value,
            notas: document.getElementById('obs_notas').value
        };

        if (Object.values(campos).some(v => v === "" || v === null)) {
            Swal.fire({
                icon: 'error',
                title: 'Registro Incompleto',
                text: 'Para la validez científica de la bitácora, todos los campos deben estar llenos.',
                background: '#14231e',
                color: '#c0c0b5',
                confirmButtonColor: '#a63a50'
            });
            return;
        }

        const payload = {
            usuario_id: campos.usuario_id,
            altura: campos.altura,
            ancho_cm: campos.hojas, // Usamos este campo para hojas en tu BD actual
            estado: campos.estado,
            notas: `[Suelo: ${campos.suelo} | Riego: ${campos.riego} | Abono: ${campos.abono}] - ${campos.notas}`
        };

        try {
            const res = await fetch(`${API}/nueva-observacion`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload) 
            });
            
            if(res.ok) {
                Toast.fire({ icon: 'success', title: 'Entrada de bitácora registrada' });
                // Limpiar campos
                document.querySelectorAll('#reg-section input, #reg-section textarea, #reg-section select').forEach(el => {
                    if(el.id !== 'sel_usuario') el.value = "";
                });
                actualizarDatos();
            }
        } catch (e) {
            Toast.fire({ icon: 'error', title: 'Error de conexión' });
        }
    }

    function renderObservaciones(lista) {
        const container = document.getElementById('grid-dinamico');
        if (lista.length === 0) {
            container.innerHTML = `<p style="text-align:center; opacity:0.5;">No hay registros para este criterio.</p>`;
            return;
        }
        container.innerHTML = lista.map(o => `
            <div class="glass-card animate__animated animate__fadeIn" style="padding:25px; margin-bottom:20px; border-left: 5px solid var(--accent-mate);">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:var(--accent-mate); font-weight:600; font-size:1.1rem;">${o.nombre}</span>
                    <span style="font-size:0.7rem; opacity:0.5;">${new Date().toLocaleDateString()}</span>
                </div>
                <div style="margin:15px 0; display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:0.9rem;">
                    <div><i class="fas fa-ruler-vertical"></i> Altura: <b>${o.altura_cm}cm</b></div>
                    <div><i class="fas fa-leaf"></i> Estado: <b>${o.estado_salud}</b></div>
                </div>
                <p style="background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; font-style:italic; font-size:0.9rem; line-height:1.5;">
                    "${o.observaciones}"
                </p>
            </div>
        `).join('');
    }

    function filtrarPorUser(id) {
        renderObservaciones(dataCache.observaciones.filter(o => o.usuario_id == id));
    }

    // Funciones de navegación y menú se mantienen igual...
    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        if (window.innerWidth <= 768) sidebar.classList.toggle('open');
        else sidebar.classList.toggle('collapsed');
    }

    function showSection(id, el) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) el.classList.add('active');
        if(id === 'obs-section') renderObservaciones(dataCache.observaciones);
        if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
    }

    async function registrarUser() {
        const nombre = document.getElementById('reg_nombre').value;
        if(!nombre) {
            Toast.fire({ icon: 'warning', title: 'Escribe un nombre' });
            return;
        }
        await fetch(`${API}/registrar`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nombre }) });
        document.getElementById('reg_nombre').value = "";
        actualizarDatos();
        Toast.fire({ icon: 'success', title: 'Investigador dado de alta' });
    }
</script>
