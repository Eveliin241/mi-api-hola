<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Botánica OS | Elite PAEC System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #050a09; --sidebar-mate: #0d1a16; --glass-panel: rgba(20, 35, 30, 0.6);
            --accent-mate: #7a6a75; --text-mate: #c0c0b5; --text-bright: #ffffff; --danger-mate: #a63a50;
            --elite-green: #1a3c34;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-deep); color: var(--text-mate); overflow: hidden; }

        #global-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1501004318641-729e8e398642?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; background-position: center; z-index: -1;
        }

        #portada {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            background: var(--bg-deep);
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.03); border-radius: 40px; padding: 60px 80px; text-align: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative;
        }
        .welcome-card::before { content: "🌿"; font-size: 3.5rem; position: absolute; top: -45px; left: 50%; transform: translateX(-50%); opacity: 0.9; }
        .brand-script { font-family: 'Great Vibes', cursive; font-size: 6rem; color: var(--text-bright); margin: 0; line-height: 1; text-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .sub-brand { font-size: 1rem; color: var(--text-mate); letter-spacing: 6px; text-transform: uppercase; margin-top: 10px; opacity: 0.7; }
        .btn-enter { margin-top: 50px; padding: 20px 60px; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; background: var(--accent-mate); color: var(--text-bright); }

        #app-wrapper { display: flex; width: 100vw; height: 100vh; position: relative; }
        #top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: transparent; display: flex; align-items: center; padding: 0 25px; z-index: 900; }
        #menu-toggle { background: none; border: none; color: var(--text-bright); font-size: 1.6rem; cursor: pointer; opacity: 0.7; transition: 0.3s; padding: 10px; border-radius: 10px; }

        nav {
            width: 280px; background: var(--sidebar-mate); display: flex; flex-direction: column;
            padding: 90px 0 30px 0; color: var(--text-bright); flex-shrink: 0; 
            transition: all 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            overflow: hidden; z-index: 850; position: relative;
        }
        nav.collapsed { width: 80px; }
        .nav-item { padding: 18px 25px; cursor: pointer; opacity: 0.6; display: flex; align-items: center; gap: 20px; transition: 0.3s; white-space: nowrap; border-left: 4px solid transparent; }
        .nav-item i { font-size: 1.2rem; width: 25px; text-align: center; }
        nav.collapsed .nav-item span { opacity: 0; pointer-events: none; }
        .nav-item.active { opacity: 1; background: rgba(255,255,255,0.06); border-left-color: var(--accent-mate); }

        main { flex-grow: 1; padding: 100px 50px 50px 50px; overflow-y: auto; background: transparent; }
        .view-section { display: none; width: 100%; max-width: 1000px; margin: 0 auto; }
        .view-section.active { display: block; animation: fadeIn 0.5s ease; }

        .glass-card {
            background: var(--glass-panel); border-radius: 30px; padding: 40px; margin-bottom: 30px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { font-weight: 300; font-size: 1.6rem; color: var(--text-bright); margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-mate); margin-top: 25px; margin-bottom: 10px; }

        /* ELITE INPUTS: Frosted Glass Style 💎 */
        input, select, textarea {
            width: 100%; padding: 18px; margin: 8px 0; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02);
            backdrop-filter: blur(5px); color: var(--text-mate); font-size: 1rem; font-family: inherit; box-sizing: border-box;
        }
        select option { background: var(--sidebar-mate); color: var(--text-mate); }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-mate); outline: none; background: rgba(255,255,255,0.05); }

        .btn-action {
            background: var(--accent-mate); color: var(--text-bright); border: none;
            padding: 18px; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .btn-action:hover { background: var(--text-bright); color: var(--bg-deep); transform: translateY(-2px); }

        .admin-trigger { margin-top: auto; padding: 20px 25px; opacity: 0.05; cursor: pointer; display: flex; align-items: center; gap: 20px; font-size: 0.8rem; }
        .admin-trigger:hover { opacity: 0.7; color: var(--text-bright); }

        .history-card { border-left: 3px solid var(--accent-mate); padding-left: 20px; margin-bottom: 25px; }
        .history-user { color: var(--accent-mate); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }

        @media (max-width: 768px) {
            #portada .brand-script { font-size: 3.5rem; }
            nav { position: fixed; left: -280px; height: 100vh; width: 280px; box-shadow: 15px 0 50px rgba(0,0,0,0.5); }
            nav.open { left: 0; }
            main { padding: 90px 20px 30px 20px; }
            .glass-card { padding: 25px; border-radius: 20px; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="global-bg"></div>
    <div id="portada">
        <div class="welcome-card animate__animated animate__fadeIn">
            <span class="plant-icon">🌿</span>
            <h1 class="brand-script">Botánica</h1>
            <p class="sub-brand">Elite PAEC System</p>
            <button class="btn-enter" onclick="iniciarApp()">ENTRAR AL SISTEMA</button>
        </div>
    </div>

    <div id="top-bar">
        <button id="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        <span style="margin-left: 20px; letter-spacing: 3px; font-size: 0.8rem; opacity: 0.5;">ELITE RESEARCH 🌱</span>
    </div>

    <div id="app-wrapper">
        <nav id="sidebar">
            <div style="padding: 0 25px 30px 25px; font-family: 'Great Vibes'; font-size: 2rem; color: var(--accent-mate);">B</div>
            <div class="nav-item active" onclick="showSection('user-section', this)"><i class="fas fa-user-plus"></i> <span>REGISTRO</span></div>
            <div class="nav-item" onclick="showSection('reg-section', this)"><i class="fas fa-seedling"></i> <span>OBSERVACIÓN</span></div>
            <div class="nav-item" onclick="showSection('obs-section', this)"><i class="fas fa-history"></i> <span>HISTORIAL</span></div>
            <div class="admin-trigger" onclick="abrirAdmin()"><i class="fas fa-cog"></i> <span>Config</span></div>
        </nav>

        <main>
            <div id="user-section" class="view-section active">
                <div class="glass-card animate__animated animate__fadeInUp">
                    <h2><i class="fas fa-user-shield"></i> Alta de Investigador 🌿</h2>
                    <input type="text" id="reg_nombre" placeholder="Nombre completo del alumno o equipo..." autocomplete="off">
                    <button class="btn-action" onclick="registrarUser()">DAR DE ALTA EN SISTEMA</button>
                </div>
            </div>

            <div id="reg-section" class="view-section">
                <div class="glass-card animate__animated animate__fadeInUp">
                    <h2><i class="fas fa-microscope"></i> Bitácora Científica - Semana #8 🌿</h2>
                    
                    <label style="font-size: 0.75rem; opacity: 0.6;">INVESTIGADOR RESPONSABLE:</label>
                    <select id="sel_usuario"></select>

                    <h3>1. Crecimiento (Lavanda)</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div>
                            <label style="font-size: 0.7rem;">ALTURA ACTUAL (CM)</label>
                            <input type="number" id="obs_altura" placeholder="Ej: 35">
                        </div>
                        <div>
                            <label style="font-size: 0.7rem;">ANCHO ACTUAL (CM - W)</label>
                            <input type="number" id="obs_ancho" placeholder="Ej: 20">
                        </div>
                    </div>
                    <input type="number" id="obs_hojas" placeholder="Nº de Hojas Aproximado">

                    <h3>2. Nutrición (Abono)</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <input type="text" id="obs_tipo_abono" placeholder="Tipo de Abono (ej: Composta)">
                        <input type="text" id="obs_cantidad_abono" placeholder="Cantidad (ej: 150g)">
                    </div>

                    <h3>3. Suelo y Riego</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <select id="obs_suelo">
                            <option value="">Estado del Suelo...</option>
                            <option>Seco</option>
                            <option>Húmedo</option>
                            <option>Encharcado</option>
                        </select>
                        <select id="obs_riego_ok">
                            <option value="">¿Riego Adecuado?</option>
                            <option>SÍ</option>
                            <option>NO (Requiere ajuste)</option>
                        </select>
                    </div>

                    <select id="obs_estado" style="margin-top:15px;">
                        <option value="">Clasificación de Salud...</option>
                        <option>Sana</option>
                        <option>Dañada</option>
                        <option>Seca</option>
                        <option>Floración</option>
                    </select>

                    <textarea id="obs_notas" rows="4" placeholder="Análisis crítico: Cambios visibles, problemas detectados, causas posibles y reflexiones científicas..."></textarea>
                    
                    <button class="btn-action" style="background: var(--elite-green);" onclick="guardarObs()">
                        <i class="fas fa-save"></i> GUARDAR REPORTE CIENTÍFICO
                    </button>
                </div>
            </div>

            <div id="obs-section" class="view-section">
                <h2><i class="fas fa-database"></i> Base de Datos de Bitácora 🌿</h2>
                <div id="pills-usuarios" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 30px;"></div>
                <div id="grid-dinamico"></div>
            </div>

            <div id="admin-panel" class="view-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                    <h2 style="color:var(--danger-mate); border:none; margin:0;">Mantenimiento</h2>
                    <button onclick="cerrarAdmin()" style="background:none; border:1px solid rgba(255,255,255,0.2); color:white; padding:8px 15px; border-radius:8px; cursor:pointer;">CERRAR</button>
                </div>
                <div id="lista-borrar" class="glass-card"></div>
            </div>
        </main>
    </div>

<script>
    const API = 'https://mi-api-hola.onrender.com';
    let dataCache = { usuarios: [], observaciones: [] };
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, background: '#0d1a16', color: '#c0c0b5' });

    function iniciarApp() { document.getElementById('portada').style.transform = 'translateY(-100%)'; actualizarDatos(); }
    function toggleMenu() { const s = document.getElementById('sidebar'); s.classList.toggle('collapsed'); }

    function showSection(id, el) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) el.classList.add('active');
        if(id === 'obs-section') renderObservaciones(dataCache.observaciones);
    }

    async function actualizarDatos() {
        try {
            const [uRes, hRes] = await Promise.all([fetch(`${API}/lista-usuarios`), fetch(`${API}/lavandas_json`)]);
            dataCache.usuarios = await uRes.json();
            dataCache.observaciones = await hRes.json();
            
            document.getElementById('sel_usuario').innerHTML = dataCache.usuarios.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
            document.getElementById('pills-usuarios').innerHTML = `<div onclick="renderObservaciones(dataCache.observaciones)" style="padding:10px 20px; background:rgba(255,255,255,0.05); border-radius:30px; cursor:pointer;">TODOS</div>` + 
                dataCache.usuarios.map(u => `<div onclick="filtrarPorUser(${u.id})" style="padding:10px 20px; background:rgba(255,255,255,0.05); border-radius:30px; cursor:pointer;">${u.nombre}</div>`).join('');
            if (document.getElementById('admin-panel').classList.contains('active')) renderListaBorrar();
        } catch (e) { console.error("Error cargando datos técnico:", e); }
    }

    function renderObservaciones(lista) {
        document.getElementById('grid-dinamico').innerHTML = lista.map(o => `
            <div class="history-card animate__animated animate__fadeIn">
                <div class="history-user">${o.nombre} <span style="opacity:0.4; font-size:0.7rem;">${new Date().toLocaleDateString()}</span></div>
                <div style="color:#fff; margin:10px 0; font-size:0.9rem;">
                    📏 H: ${o.altura_cm}cm | W: ${o.ancho_cm || o.ancho || 0}cm — <b>${o.estado_salud}</b>
                </div>
                <p style="opacity:0.8; font-size:0.95rem; margin:0; line-height:1.6; background:rgba(0,0,0,0.2); padding:15px; border-radius:10px;">
                    "${o.observaciones}"
                </p>
            </div>
        `).join('');
    }

    function filtrarPorUser(id) { renderObservaciones(dataCache.observaciones.filter(o => o.usuario_id == id)); }

    async function guardarObs() {
        // BLINDAJE ELITE: Validación estricta para no dejar campos vacíos
        const campos = {
            id_u: document.getElementById('sel_usuario').value,
            H: document.getElementById('obs_altura').value,
            W: document.getElementById('obs_ancho').value,
            L: document.getElementById('obs_hojas').value,
            A: document.getElementById('obs_tipo_abono').value,
            AQ: document.getElementById('obs_cantidad_abono').value,
            S: document.getElementById('obs_suelo').value,
            R: document.getElementById('obs_riego_ok').value,
            E: document.getElementById('obs_estado').value,
            N: document.getElementById('obs_notas').value
        };

        if (Object.values(campos).some(v => v === "" || v === null)) {
            Swal.fire({ icon: 'error', title: 'Registro Incompleto', text: 'El protocolo PAEC exige todos los campos llenos.', background: '#0d1a16', color: '#c0c0b5', confirmButtonColor: '#a63a50' });
            return;
        }

        const payload = {
            usuario_id: campos.id_u,
            altura: campos.H,
            ancho_cm: campos.W, // EL FIX DE LA W: Ahora sí se envía correctamente
            estado: campos.E,
            // Empaquetamos todo lo demás en notas para tu BD actual
            observaciones: `[Hojas: ${campos.L} | Abono: ${campos.A} (${campos.AQ}) | Suelo: ${campos.S} | Riego Adecuado: ${campos.R}] - ${campos.N}`
        };

        await fetch(`${API}/nueva-observacion`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        
        // Limpieza Elite
        document.querySelectorAll('#reg-section input, #reg-section textarea, #reg-section select').forEach(el => { if(el.id !== 'sel_usuario') el.value = ""; });
        actualizarDatos();
        Toast.fire({ icon: 'success', title: 'Reporte Científico Guardado' });
    }

    // Funciones Admin y Registro de Usuario se mantienen igual pero blindadas
    async function registrarUser() {
        const nombre = document.getElementById('reg_nombre').value;
        if(!nombre) return;
        await fetch(`${API}/registrar`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nombre }) });
        document.getElementById('reg_nombre').value = "";
        actualizarDatos();
        Toast.fire({ icon: 'success', title: 'Alta Exitosa' });
    }

    async function abrirAdmin() {
        const { value: pass } = await Swal.fire({ title: 'Clave Élite', input: 'password', confirmButtonColor: '#0d1a16', background: '#14231e', color: '#c0c0b5', inputAttributes: { autocomplete: 'new-password' } });
        if (pass === 'osio2023') { renderListaBorrar(); showSection('admin-panel'); } 
        else if (pass) { Swal.fire({ icon: 'error', title: 'Denegado', background: '#14231e', color: '#c0c0b5' }); }
    }
    function cerrarAdmin() { showSection('user-section', document.querySelector('.nav-item')); }
    function renderListaBorrar() { document.getElementById('lista-borrar').innerHTML = dataCache.usuarios.map(u => `<div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>${u.nombre}</span><button onclick="borrarU(${u.id})" style="color:var(--danger-mate); background:none; border:none; cursor:pointer;">[BORRAR]</button></div>`).join(''); }
    async function borrarU(id) { const result = await Swal.fire({ title: '¿Borrar?', text: 'Se perderán sus datos PAEC.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#a63a50', background: '#14231e', color: '#c0c0b5' }); if (result.isConfirmed) { await fetch(`${API}/admin/borrar-usuario/${id}`, { method: 'DELETE' }); await actualizarDatos(); } }
</script>
</body>
</html>
