<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪻 Botánica OS | Professional Elite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪻</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #020504; --card: rgba(12, 18, 16, 0.95); --gold: #d4af37; --lavender: #967bb6; --text: #e0e0d0; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR PRO */
        nav { width: 280px; background: #050807; border-right: 1px solid rgba(212, 175, 55, 0.1); display: flex; flex-direction: column; }
        .nav-logo { padding: 40px 20px; font-family: 'Great Vibes'; font-size: 2.5rem; color: var(--gold); text-align: center; }
        .nav-btn { padding: 18px 25px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; font-size: 0.85rem; border-left: 4px solid transparent; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .nav-btn:hover { background: rgba(255,255,255,0.02); opacity: 1; color: var(--gold); }
        .nav-btn.active { background: rgba(212, 175, 55, 0.05); border-left-color: var(--gold); opacity: 1; color: #fff; }

        main { flex-grow: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, #0d1a16, #020504); }
        .view { display: none; max-width: 950px; margin: 0 auto; }
        .view.active { display: block; animation: fadeIn 0.4s ease-out; }

        .glass { background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.05); box-shadow: 0 25px 50px rgba(0,0,0,0.7); margin-bottom: 20px; }
        h2 { font-weight: 300; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 25px; color: var(--gold); font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        input, select, textarea { width: 100%; padding: 16px; margin: 8px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.3); color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--gold); background: rgba(0,0,0,0.5); }

        .btn-gold { background: var(--gold); color: #000; border: none; padding: 18px; border-radius: 12px; width: 100%; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 15px; text-transform: uppercase; }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }

        /* MÓDULO FOTOGRÁFICO */
        .photo-zone { border: 2px dashed rgba(212, 175, 55, 0.2); border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; margin: 15px 0; transition: 0.3s; }
        .photo-zone:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        #img-preview { max-width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid var(--gold); }

        /* HISTORIAL CARDS */
        .h-card { background: rgba(255,255,255,0.02); padding: 25px; border-radius: 20px; margin-bottom: 20px; border-left: 4px solid var(--lavender); position: relative; }
        .h-tag { font-size: 0.7rem; color: var(--gold); font-weight: 700; margin-bottom: 5px; display: block; opacity: 0.8; }
        .h-data { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin: 15px 0; }
        .h-val { font-size: 0.9rem; color: #fff; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; }
        
        .delete-btn { position: absolute; top: 20px; right: 20px; color: #ff4d4d; cursor: pointer; display: none; opacity: 0.6; }
        .delete-btn:hover { opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">🪻 Botánica</div>
        <div class="nav-btn active" onclick="nav('v-reg')"><i class="fas fa-id-badge"></i> Registro Élite</div>
        <div class="nav-btn" onclick="nav('v-bit')"><i class="fas fa-microscope"></i> Bitácora Pro</div>
        <div class="nav-btn" onclick="nav('v-hist')"><i class="fas fa-scroll"></i> Historial Maestro</div>
        
        <div style="margin-top: auto; padding: 25px;">
            <div class="nav-btn" style="border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; opacity: 0.4;" onclick="adminMode()">
                <i class="fas fa-key"></i> Clave Élite
            </div>
        </div>
    </nav>

    <main>
        <div id="v-reg" class="view active">
            <div class="glass">
                <h2><i class="fas fa-user-shield"></i> Alta de Investigadores</h2>
                <input type="text" id="reg-name" placeholder="Nombre completo o Nombre del Equipo..." autocomplete="off">
                <select id="reg-type">
                    <option value="IND">Investigador Individual 👤</option>
                    <option value="EQP">Equipo Científico 👥</option>
                </select>
                <button class="btn-gold" onclick="saveMaster()">Sincronizar con Base de Datos</button>
            </div>
        </div>

        <div id="v-bit" class="view">
            <div class="glass">
                <h2><i class="fas fa-clipboard-check"></i> Reporte de Campo Semanal</h2>
                <select id="bit-user"></select>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div><label style="font-size: 0.7rem; color: var(--gold);">ALTURA (CM)</label><input type="number" id="bit-h" placeholder="Ej: 34"></div>
                    <div><label style="font-size: 0.7rem; color: var(--gold);">AMPLITUD W (CM)</label><input type="number" id="bit-w" placeholder="Ej: 15"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <select id="bit-abono">
                        <option value="Orgánico">Abono Orgánico</option>
                        <option value="Químico">Abono Químico</option>
                        <option value="Ninguno">Sin Abono</option>
                    </select>
                    <select id="bit-riego">
                        <option value="Adecuado">Riego Adecuado</option>
                        <option value="Excesivo">Excesivo</option>
                        <option value="Insuficiente">Insuficiente</option>
                    </select>
                </div>

                <div class="photo-zone" onclick="document.getElementById('f-in').click()">
                    <i class="fas fa-camera-retro" style="font-size: 1.5rem; color: var(--gold);"></i>
                    <p style="font-size: 0.8rem; margin: 5px 0;">Subir Evidencia Fotográfica 🪻</p>
                    <input type="file" id="f-in" hidden accept="image/*" onchange="previewImg(this)">
                    <img id="img-preview">
                </div>

                <textarea id="bit-obs" rows="3" placeholder="Análisis crítico: cambios visibles, plagas o salud general..."></textarea>
                <button class="btn-gold" onclick="sendReport()">Cargar Reporte Científico</button>
            </div>
        </div>

        <div id="v-hist" class="view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2><i class="fas fa-database"></i> Archivo Central</h2>
                <button onclick="loadMasterHistory()" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:8px 15px; border-radius:10px; cursor:pointer;"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div id="master-container"></div>
        </div>
    </main>

<script>
    const API = 'https://mi-api-hola.onrender.com';
    let isAdmin = false;

    // SEGURIDAD AMARILLO GOLD
    async function adminMode() {
        const { value: pass } = await Swal.fire({
            title: 'CLAVE ÉLITE',
            input: 'text',
            inputAttributes: { style: '-webkit-text-security: disc; autocomplete: off;' },
            background: '#050807', color: '#d4af37', confirmButtonColor: '#d4af37'
        });
        if(pass === 'osio2023') {
            isAdmin = true;
            Swal.fire('Acceso Total', 'Panel de administración desbloqueado', 'success');
            loadMasterHistory();
        }
    }

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'v-bit') loadUsers();
        if(id === 'v-hist') loadMasterHistory();
    }

    function previewImg(input) {
        const reader = new FileReader();
        reader.onload = (e) => { 
            const img = document.getElementById('img-preview');
            img.src = e.target.result; img.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }

    async function saveMaster() {
        const n = document.getElementById('reg-name').value;
        const t = document.getElementById('reg-type').value;
        if(!n) return Swal.fire('Error', 'Falta el nombre', 'error');
        const finalName = t === 'EQP' ? `👥 EQUIPO: ${n}` : `👤 ${n}`;
        await fetch(`${API}/registrar`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nombre: finalName }) });
        document.getElementById('reg-name').value = '';
        Swal.fire('Botánica OS', 'Entidad vinculada correctamente', 'success');
    }

    async function loadUsers() {
        const r = await fetch(`${API}/lista-usuarios`);
        const d = await r.json();
        document.getElementById('bit-user').innerHTML = d.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
    }

    async function sendReport() {
        const payload = {
            usuario_id: document.getElementById('bit-user').value,
            altura: document.getElementById('bit-h').value,
            ancho_cm: document.getElementById('bit-w').value,
            estado: document.getElementById('bit-riego').value, // Usamos este campo para salud/riego
            observaciones: `Abono: ${document.getElementById('bit-abono').value}. Notas: ${document.getElementById('bit-obs').value}`
        };

        await fetch(`${API}/nueva-observacion`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        
        // RESET TOTAL
        document.getElementById('bit-h').value = '';
        document.getElementById('bit-w').value = '';
        document.getElementById('bit-obs').value = '';
        document.getElementById('img-preview').style.display = 'none';
        
        Swal.fire('Élite', 'Reporte Científico Almacenado', 'success');
        nav('v-hist');
    }

    async function loadMasterHistory() {
        const container = document.getElementById('master-container');
        container.innerHTML = '<p style="text-align:center; opacity:0.3;">Sincronizando registros...</p>';
        const r = await fetch(`${API}/lavandas_json`);
        const data = await r.json();
        
        container.innerHTML = data.reverse().map(o => `
            <div class="h-card">
                ${isAdmin ? `<i class="fas fa-trash delete-btn" style="display:block" onclick="deleteEntry(${o.id})"></i>` : ''}
                <span class="h-tag">${o.nombre}</span>
                <div class="h-data">
                    <div class="h-val">📏 H: ${o.altura_cm}cm</div>
                    <div class="h-val">↔️ W: ${o.ancho_cm}cm</div>
                    <div class="h-val">💧 ${o.estado}</div>
                </div>
                <p style="font-size:0.85rem; opacity:0.8; line-height:1.5; margin:0;">"${o.observaciones}"</p>
            </div>
        `).join('');
    }
</script>
</body>
</html>
