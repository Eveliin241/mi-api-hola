<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Botánica OS | Global Enterprise Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #030706; --sidebar-mate: #08120f; --glass: rgba(15, 25, 22, 0.7);
            --accent: #7a6a75; --text: #c0c0b5; --bright: #ffffff; --elite: #1a3c34;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-deep); color: var(--text); overflow: hidden; }

        /* FONDO DINÁMICO */
        #global-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; z-index: -1;
        }

        /* SIDEBAR ESTILO AMAZON PRO */
        nav {
            width: 260px; background: var(--sidebar-mate); height: 100vh;
            display: flex; flex-direction: column; transition: 0.3s; z-index: 1000;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .nav-header { padding: 30px; font-family: 'Great Vibes'; font-size: 2.2rem; color: var(--accent); }
        
        .menu-group { margin-bottom: 10px; }
        .menu-label { padding: 10px 25px; font-size: 0.65rem; letter-spacing: 2px; opacity: 0.4; text-transform: uppercase; }
        
        .nav-item { 
            padding: 15px 25px; cursor: pointer; display: flex; align-items: center; gap: 15px;
            transition: 0.2s; font-size: 0.9rem; border-left: 3px solid transparent;
        }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--bright); }
        .nav-item.active { background: rgba(255,255,255,0.05); border-left-color: var(--accent); color: var(--bright); }

        /* SUBMENÚS */
        .submenu { background: rgba(0,0,0,0.2); display: none; padding-left: 20px; }
        .submenu.open { display: block; }
        .sub-item { padding: 10px 25px; font-size: 0.8rem; opacity: 0.6; cursor: pointer; }
        .sub-item:hover { opacity: 1; color: var(--accent); }

        main { flex-grow: 1; padding: 40px; overflow-y: auto; position: relative; }
        .glass-card {
            background: var(--glass); border-radius: 20px; padding: 35px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.03);
            max-width: 900px; margin: 0 auto 30px;
        }

        /* INPUTS ELITE CON NO-AUTOCOMPLETE */
        input, select, textarea {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.3);
            color: var(--bright); font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.5); }

        .btn-elite {
            background: var(--accent); color: white; border: none; padding: 15px;
            border-radius: 12px; cursor: pointer; width: 100%; font-weight: 600;
            letter-spacing: 1px; transition: 0.3s; margin-top: 10px;
        }
        .btn-elite:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* TARJETAS DE HISTORIAL DETALLADAS */
        .report-box {
            background: rgba(255,255,255,0.02); border-radius: 15px; padding: 20px;
            margin-bottom: 20px; border-left: 4px solid var(--accent);
        }
        .report-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.8rem; }
        .tag { background: var(--elite); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="global-bg"></div>
    
    <div style="display: flex;">
        <nav>
            <div class="nav-header">Botánica</div>
            
            <div class="menu-group">
                <div class="menu-label">Gestión de Personal</div>
                <div class="nav-item" onclick="toggleSub('sub-registro')"><i class="fas fa-users-cog"></i> <span>Altas Élite</span></div>
                <div id="sub-registro" class="submenu">
                    <div class="sub-item" onclick="showSection('reg-persona')">👤 Nueva Persona</div>
                    <div class="sub-item" onclick="showSection('reg-equipo')">👥 Nuevo Equipo</div>
                    <div class="sub-item" onclick="showSection('vincular-equipo')">🔗 Vincular Miembros</div>
                </div>
            </div>

            <div class="menu-group">
                <div class="menu-label">Investigación</div>
                <div class="nav-item" onclick="showSection('section-obs')"><i class="fas fa-flask"></i> <span>Nueva Bitácora</span></div>
                <div class="nav-item" onclick="showSection('section-historial')"><i class="fas fa-database"></i> <span>Historial Completo</span></div>
            </div>

            <div style="margin-top: auto; padding: 20px;">
                <div class="nav-item" onclick="loginElite()" style="opacity: 0.3; font-size: 0.7rem;"><i class="fas fa-lock"></i> Mantenimiento</div>
            </div>
        </nav>

        <main>
            <div id="reg-persona" class="view-section" style="display: none;">
                <div class="glass-card animate__animated animate__fadeIn">
                    <h2>Registrar Nuevo Investigador</h2>
                    <input type="text" id="p_nombre" placeholder="Nombre completo..." autocomplete="off">
                    <button class="btn-elite" onclick="crearPersona()">GUARDAR PERSONA</button>
                </div>
            </div>

            <div id="section-obs" class="view-section">
                <div class="glass-card animate__animated animate__fadeIn">
                    <h2>Reporte Científico Semana #8 🌿</h2>
                    <select id="sel_entidad"></select>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <input type="number" id="h_altura" placeholder="Altura (cm)">
                        <input type="number" id="h_ancho" placeholder="Ancho (W) cm">
                        <input type="number" id="h_hojas" placeholder="Nº Hojas">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <input type="text" id="h_abono" placeholder="Tipo de Abono">
                        <input type="text" id="h_cantidad" placeholder="Cantidad (g/ml)">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <select id="h_suelo">
                            <option value="">Estado Suelo...</option>
                            <option>Seco</option><option>Húmedo</option><option>Encharcado</option>
                        </select>
                        <select id="h_riego">
                            <option value="">¿Riego OK?</option>
                            <option>SÍ</option><option>NO</option>
                        </select>
                    </div>

                    <textarea id="h_notas" rows="4" placeholder="Observaciones críticas y análisis..."></textarea>
                    <button class="btn-elite" onclick="guardarTodo()">PUBLICAR REPORTE</button>
                </div>
            </div>

            <div id="section-historial" class="view-section" style="display: none;">
                <h2>Base de Datos Maestra 📊</h2>
                <div id="contenedor-historial"></div>
            </div>
        </main>
    </div>

<script>
    const API = 'https://mi-api-hola.onrender.com';
    let dataCache = { usuarios: [], observaciones: [] };

    function toggleSub(id) { document.getElementById(id).classList.toggle('open'); }

    function showSection(id) {
        document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if(id === 'section-historial') cargarHistorial();
    }

    // SEGURIDAD ÉLITE: Cero guardado de contraseña en navegador
    async function loginElite() {
        const { value: pass } = await Swal.fire({
            title: 'Acceso Restringido',
            html: '<input type="password" id="swal-input1" class="swal2-input" autocomplete="new-password" placeholder="Clave Elite">',
            focusConfirm: false,
            background: '#08120f', color: '#fff',
            preConfirm: () => document.getElementById('swal-input1').value
        });
        
        if (pass === 'osio2023') {
            Swal.fire('Bienvenido, Encargado Elite', '', 'success');
        } else {
            Swal.fire('Acceso Denegado', 'No eres nivel Pro', 'error');
        }
    }

    async function guardarTodo() {
        const payload = {
            usuario_id: document.getElementById('sel_entidad').value,
            altura: document.getElementById('h_altura').value,
            ancho_cm: document.getElementById('h_ancho').value,
            estado: "Registrado",
            observaciones: JSON.stringify({
                hojas: document.getElementById('h_hojas').value,
                abono: document.getElementById('h_abono').value,
                cantidad: document.getElementById('h_cantidad').value,
                suelo: document.getElementById('h_suelo').value,
                riego: document.getElementById('h_riego').value,
                notas: document.getElementById('h_notas').value
            })
        };

        // VALIDACIÓN PRO: No vacíos
        if(!payload.altura || !payload.ancho_cm) return Swal.fire('Error', 'Completa los datos técnicos', 'error');

        await fetch(`${API}/nueva-observacion`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        Swal.fire('Éxito', 'Bitácora actualizada', 'success');
        actualizarSelects();
    }

    async function cargarHistorial() {
        const res = await fetch(`${API}/lavandas_json`);
        const obs = await res.json();
        const container = document.getElementById('contenedor-historial');
        
        container.innerHTML = obs.map(o => {
            let detalles = {hojas: '?', abono: '?', suelo: '?', notas: o.observaciones};
            try { detalles = JSON.parse(o.observaciones); } catch(e){}

            return `
                <div class="report-box animate__animated animate__fadeInUp">
                    <div class="report-header">
                        <span style="color:var(--accent); font-weight:bold;">${o.nombre}</span>
                        <span class="tag">SEMANA #8</span>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px; margin-bottom:15px;">
                        <div>📏 H: ${o.altura_cm}cm</div>
                        <div>↔️ W: ${o.ancho_cm}cm</div>
                        <div>🌿 Hojas: ${detalles.hojas || '0'}</div>
                    </div>
                    <div style="font-size:0.85rem; opacity:0.8; border-top:1px solid rgba(255,255,255,0.05); pt-10px;">
                        <b>Nutrición:</b> ${detalles.abono} | <b>Suelo:</b> ${detalles.suelo} | <b>Riego:</b> ${detalles.riego}<br>
                        <p style="margin-top:10px; font-style:italic;">"${detalles.notas}"</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function actualizarSelects() {
        const res = await fetch(`${API}/lista-usuarios`);
        const users = await res.json();
        document.getElementById('sel_entidad').innerHTML = users.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
    }

    window.onload = actualizarSelects;
</script>
</body>
</html>
