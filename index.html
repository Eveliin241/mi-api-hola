<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Botánica OS | Global Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #020504; --card: rgba(10, 20, 18, 0.9); --accent: #7a6a75; --text: #d1d1c7; --gold: #c5a059; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR ELITE */
        nav { width: 300px; background: #050a09; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; z-index: 100; }
        .nav-logo { padding: 40px 20px; font-family: 'Great Vibes'; font-size: 2.8rem; color: var(--gold); text-align: center; }
        .nav-btn { padding: 18px 30px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; font-size: 0.9rem; border-left: 4px solid transparent; opacity: 0.6; }
        .nav-btn:hover { background: rgba(255,255,255,0.02); opacity: 1; }
        .nav-btn.active { background: rgba(197, 160, 89, 0.05); border-left-color: var(--gold); opacity: 1; color: #fff; }

        main { flex-grow: 1; padding: 50px; overflow-y: auto; background: radial-gradient(circle at top right, #0a1512, #020504); }
        .view { display: none; max-width: 900px; margin: 0 auto; }
        .view.active { display: block; animation: fadeIn 0.5s ease; }

        .glass { background: var(--card); padding: 45px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        h2 { font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; color: #fff; }

        input, select, textarea { width: 100%; padding: 20px; margin: 12px 0; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.4); color: #fff; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(197, 160, 89, 0.1); }

        .btn-main { background: var(--gold); color: #000; border: none; padding: 22px; border-radius: 18px; width: 100%; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: 0.4s; margin-top: 25px; }
        .btn-main:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(197, 160, 89, 0.2); background: #dcb66b; }

        /* HISTORIAL PROFESIONAL */
        .report-item { background: rgba(255,255,255,0.02); padding: 30px; border-radius: 25px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.03); transition: 0.3s; }
        .report-item:hover { background: rgba(255,255,255,0.04); transform: scale(1.01); }
        .data-badge { display: inline-block; padding: 8px 15px; border-radius: 10px; background: rgba(0,0,0,0.3); font-size: 0.85rem; font-weight: 600; margin-right: 10px; color: var(--gold); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Botánica</div>
        <div class="nav-btn active" onclick="nav('v-reg')"><i class="fas fa-user-plus"></i> Altas de Sistema</div>
        <div class="nav-btn" onclick="nav('v-bit')"><i class="fas fa-leaf"></i> Nueva Observación</div>
        <div class="nav-btn" onclick="nav('v-hist')"><i class="fas fa-database"></i> Historial Maestro</div>
        <div style="margin-top: auto; padding: 30px;">
            <div class="nav-btn" style="opacity: 0.3; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;" onclick="ghostLogin()">
                <i class="fas fa-fingerprint"></i> Ghost Mode
            </div>
        </div>
    </nav>

    <main>
        <div id="v-reg" class="view active">
            <div class="glass">
                <h2>Cédula de Identidad 👤</h2>
                <input type="text" id="reg-name" placeholder="Nombre completo o Nombre del Equipo..." autocomplete="off">
                <select id="reg-type">
                    <option value="IND">INVESTIGADOR INDIVIDUAL</option>
                    <option value="EQP">EQUIPO CIENTÍFICO</option>
                </select>
                <button class="btn-main" onclick="masterRegister()">DAR DE ALTA AL INSTANTE</button>
            </div>
        </div>

        <div id="v-bit" class="view">
            <div class="glass">
                <h2>Bitácora Semanal 🌿</h2>
                <select id="bit-user"><option>Cargando personal...</option></select>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <input type="number" id="bit-h" placeholder="Altura (cm)">
                    <input type="number" id="bit-w" placeholder="Amplitud (W) cm">
                </div>
                <textarea id="bit-obs" rows="4" placeholder="Análisis detallado de salud, suelo y riego..."></textarea>
                <button class="btn-main" onclick="submitObservation()">ENVIAR A NUBE PRIVADA</button>
            </div>
        </div>

        <div id="v-hist" class="view">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2>Registros de Campo</h2>
                <button onclick="loadHistory()" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:10px 20px; border-radius:10px; cursor:pointer;"><i class="fas fa-sync"></i></button>
            </div>
            <div id="hist-container"></div>
        </div>
    </main>

<script>
    const ENDPOINT = 'https://mi-api-hola.onrender.com';

    // SEGURIDAD ANTI-HUMILLACIÓN (Ghost Login)
    async function ghostLogin() {
        const { value: key } = await Swal.fire({
            title: 'AUTENTICACIÓN GHOST',
            input: 'text', // Usamos text para que el navegador no sepa que es password
            inputAttributes: { style: '-webkit-text-security: disc; autocomplete: off;' },
            background: '#050a09', color: '#fff', confirmButtonColor: '#c5a059'
        });
        if(key === 'osio2023') Swal.fire('Acceso Total', 'Nivel Pro activado', 'success');
    }

    function nav(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'v-bit') fetchUsers();
        if(id === 'v-hist') loadHistory();
    }

    // REGISTRO MASTER (Personas y Equipos)
    async function masterRegister() {
        const name = document.getElementById('reg-name').value;
        const type = document.getElementById('reg-type').value;
        if(!name) return Swal.fire('Error', 'Falta el nombre de la entidad', 'error');

        const finalName = type === 'EQP' ? `[EQUIPO] ${name}` : name;
        
        await fetch(`${ENDPOINT}/registrar`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ nombre: finalName })
        });

        document.getElementById('reg-name').value = '';
        Swal.fire('Botánica OS', `${finalName} registrado en la Red Global`, 'success');
    }

    async function fetchUsers() {
        const r = await fetch(`${ENDPOINT}/lista-usuarios`);
        const d = await r.json();
        document.getElementById('bit-user').innerHTML = d.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
    }

    // ENVÍO Y LIMPIEZA TOTAL
    async function submitObservation() {
        const payload = {
            usuario_id: document.getElementById('bit-user').value,
            altura: document.getElementById('bit-h').value,
            ancho_cm: document.getElementById('bit-w').value,
            estado: "Vigoroso",
            observaciones: document.getElementById('bit-obs').value
        };

        if(!payload.altura || !payload.ancho_cm) return Swal.fire('Dato Faltante', 'La amplitud (W) es obligatoria', 'warning');

        await fetch(`${ENDPOINT}/nueva-observacion`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        // LIMPIEZA DE MEMORIA (Reset)
        document.getElementById('bit-h').value = '';
        document.getElementById('bit-w').value = '';
        document.getElementById('bit-obs').value = '';
        
        Swal.fire('Élite', 'Reporte guardado y memoria liberada', 'success');
        nav('v-hist');
    }

    async function loadHistory() {
        const container = document.getElementById('hist-container');
        container.innerHTML = '<p style="text-align:center; opacity:0.5;">Sincronizando con satélite...</p>';
        
        const r = await fetch(`${ENDPOINT}/lavandas_json`);
        const data = await r.json();
        
        container.innerHTML = data.reverse().map(o => `
            <div class="report-item">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:10px;">
                    <span style="font-weight:700; color:#fff;">${o.nombre || 'Anónimo'}</span>
                    <span style="font-size:0.8rem; opacity:0.4;">ID: ${o.usuario_id}</span>
                </div>
                <div style="margin: 15px 0;">
                    <span class="data-badge">📏 Altura: ${o.altura_cm}cm</span>
                    <span class="data-badge">↔️ Amplitud: ${o.ancho_cm || '--'}cm</span>
                </div>
                <p style="background:rgba(0,0,0,0.2); padding:20px; border-radius:15px; line-height:1.6; border:1px solid rgba(255,255,255,0.02);">
                    ${o.observaciones && o.observaciones !== 'null' ? o.observaciones : '<span style="opacity:0.3;">Sin notas analíticas</span>'}
                </p>
            </div>
        `).join('');
    }
</script>
</body>
</html>
